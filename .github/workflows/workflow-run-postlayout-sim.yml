name: Post-layout simulation verification

# Runs AFTER a PR has been merged into main:
#   merge -> push to main -> "Run Layout Verification" passes -> this workflow
# Simulates the layout files that the merged PR added, changed, or renamed,
# and posts the results as a comment on that (merged) PR.

on:
  workflow_run:
    workflows: ["Run Layout Verification"]
    types:
      - completed

permissions:
  contents: write   # to push result images to the simulation-results branch

jobs:
  secure-sim:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.repository_owner == 'SiEPIC' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Find the merged PR for this commit
        id: getpr
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Commit on main: $SHA"
          git log -1 --pretty=%B

          # GitHub lists the PR(s) associated with a commit, including merged ones
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)] | .[0] // empty')

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty')
          USERNAME=$(echo "$PR_JSON" | jq -r '.user.login // empty')

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "Found PR #: $PR_NUMBER"
          echo "Found username: $USERNAME"
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Detect layout files added or changed by the PR
        id: check_files
        run: |
          if [ -z "${{ steps.getpr.outputs.pr_number }}" ]; then
            echo "No merged PR found for this commit (direct push?). Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "All changes brought in by the PR:"
          git diff --name-status HEAD^1 HEAD

          # A = added, M = modified, R = renamed (lists the new name)
          FILES=$(git diff --diff-filter=AMR --name-only HEAD^1 HEAD | grep -i -E '^submissions/.*\.(gds|oas)$' | sed 's|^submissions/||' || true)

          if [ -z "$FILES" ]; then
            echo "No .gds or .oas files in submissions/ in this PR. Skipping."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "$FILES"
            echo "$FILES" > files_to_copy.txt
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        if: steps.check_files.outputs.found == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -l -f ~/.ssh/id_ed25519 || echo "Invalid SSH key"

          cat <<EOF > ~/.ssh/config
          Host turing
            HostName turing.phas.ubc.ca
            User lukasc
            Port 7743
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
            ForwardAgent yes
          Host baker
            User lukasc
            ProxyJump turing
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
            ForwardAgent yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Copy layout files to Baker
        if: steps.check_files.outputs.found == 'true'
        run: |
          USERNAME="${{ steps.getpr.outputs.username }}"
          echo "Simulating for PR #${{ steps.getpr.outputs.pr_number }} by $USERNAME"

          if [ -z "$USERNAME" ]; then
            echo "❌ USERNAME is blank. Refusing to proceed."
            exit 1
          fi

          cat files_to_copy.txt
          ssh baker "mkdir -p ~/simulations/$USERNAME; rm -rf ~/simulations/$USERNAME/*"

          FILES=$(awk '{print "submissions/" $0}' files_to_copy.txt | xargs -r ls 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "⚠️ No existing files to copy. Exiting."
            exit 0
          fi

          scp $FILES baker:~/simulations/$USERNAME/

      - name: Run simulation and fetch results
        if: steps.check_files.outputs.found == 'true'
        run: |
          USERNAME="${{ steps.getpr.outputs.username }}"
          FILE_LIST=$(<files_to_copy.txt)

          echo "This is an experimental feature.  The goal is to run a circuit simulation on the design, and return the results for human verification." > comment.txt
          echo "" >> comment.txt

          for file in $FILE_LIST; do
            FILE_BASENAME=$(basename "$file")
            echo "Starting simulation on Baker for $FILE_BASENAME"

            # 5 min time limit
            timeout 300s ssh baker "cd simulations && python3 run_circuit_simulation.py $USERNAME/$FILE_BASENAME" \
              | tee sim_stdout.txt
            RET_CODE=${PIPESTATUS[0]}
            echo "SSH return code: $RET_CODE"
            [ $RET_CODE -eq 124 ] && echo "❌ SSH command timed out."

            timeout 60s rsync -avz --ignore-existing --update baker:simulations/$USERNAME/ ./output/ \
              || echo "❌ rsync failed or timed out."

            if [ $RET_CODE -eq 0 ]; then
              echo "✅ Simulation results for \`$FILE_BASENAME\`" >> comment.txt
            else
              echo "❌ Simulation failed for \`$FILE_BASENAME\` (exit code $RET_CODE)" >> comment.txt
            fi
            echo "" >> comment.txt

            if [ -s sim_stdout.txt ]; then
              echo "**stdout:**" >> comment.txt
              echo '```' >> comment.txt
              cat sim_stdout.txt >> comment.txt
              echo '```' >> comment.txt
              echo "" >> comment.txt
            fi
          done

      # GitHub comments can only show images that are hosted somewhere.
      # They go to a separate "simulation-results" branch in this repo:
      # not into main, and not into the student's fork.
      # Pushed with GITHUB_TOKEN, so it does not trigger any workflows.
      - name: Publish result images
        if: steps.check_files.outputs.found == 'true'
        run: |
          PR_NUMBER="${{ steps.getpr.outputs.pr_number }}"
          if ! ls output/*.png >/dev/null 2>&1; then
            echo "No PNGs produced."
            exit 0
          fi

          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" simulation-results >/dev/null 2>&1; then
            git clone --depth=1 --branch simulation-results "$REPO_URL" results
          else
            mkdir results
            git -C results init -b simulation-results
            git -C results remote add origin "$REPO_URL"
          fi

          cd results
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p "pr-$PR_NUMBER"
          cp ../output/*.png "pr-$PR_NUMBER/"
          git add "pr-$PR_NUMBER"
          git commit -m "Simulation results for PR #$PR_NUMBER" || echo "No changes"
          git push origin simulation-results

      - name: Append images to comment
        if: steps.check_files.outputs.found == 'true'
        run: |
          PR_NUMBER="${{ steps.getpr.outputs.pr_number }}"
          if ls output/*.png >/dev/null 2>&1; then
            echo "📸 Simulation result image(s):" >> comment.txt
            for img in output/*.png; do
              FILENAME=$(basename "$img")
              echo "![${FILENAME}](https://github.com/${{ github.repository }}/blob/simulation-results/pr-${PR_NUMBER}/${FILENAME}?raw=true)" >> comment.txt
            done
            echo "" >> comment.txt
          fi

          echo "_To re-run this simulation, update your layout file and submit it in a new pull request._" >> comment.txt
          echo "" >> comment.txt
          echo " I hereby grant you permission to use these plots for inclusion in a course report." >> comment.txt
          echo "" >> comment.txt

          dt=$(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M:%S %Z')
          echo " - Simulation date: $dt " >> comment.txt

      - name: Find existing simulation comment
        uses: peter-evans/find-comment@v3
        if: steps.check_files.outputs.found == 'true'
        id: fc
        with:
          token: ${{ secrets.PAT }}
          issue-number: ${{ steps.getpr.outputs.pr_number }}
          body-includes: "This is an experimental feature."

      - name: Post simulation results as PR comment
        if: steps.check_files.outputs.found == 'true'
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ github.repository }}
          issue-number: ${{ steps.getpr.outputs.pr_number }}
          body-path: comment.txt
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
