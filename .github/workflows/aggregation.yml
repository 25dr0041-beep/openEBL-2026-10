name: Run Aggregation Script

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Run Layout Verification"]
    types:
      - completed

jobs:
  merge:
    # run on manual trigger, or after a successful verification that was
    # NOT a pull request and NOT the merge of our own aggregation PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target' &&
        !contains(github.event.workflow_run.head_commit.message, 'automation/aggregation-output')
      )
    runs-on: ubuntu-latest

    steps:
      - name: show trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Upstream event: ${{ github.event.workflow_run.event }}"
          echo "Upstream commit: ${{ github.event.workflow_run.head_commit.message }}"

      - name: checkout repo content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original modification time of files
        uses: chetan/git-restore-mtime-action@v2

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install Python packages
        run: pip install siepic_ebeam_pdk IPython

      - name: run Aggregation script
        run: python merge/EBeam_merge.py

      - name: move Aggregation output files to new folder
        run: |
          mkdir -p merge_output
          for file in EBeam.oas EBeam.txt; do
            cp "merge/$file" merge_output/
          done

      - name: upload artifact
        uses: actions/upload-artifact@v4
        id: artifact-upload
        with:
          name: merge-files
          path: merge_output/

      - name: get artifact url
        run: |
          ARTIFACT_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact-upload.outputs.artifact-id }}"
          echo "Artifact URL: $ARTIFACT_URL"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> $GITHUB_ENV

      - name: update url in runner README
        run: |
          start_delim="<!-- start-link -->"
          end_delim="<!-- end-link -->"
          sed -i "/$start_delim/,/$end_delim/d" README.md
          printf "$start_delim\n$ARTIFACT_URL\n$end_delim\n" >> README.md

      - name: Create or update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          branch: automation/aggregation-output
          base: main
          title: "Update aggregation outputs"
          body: |
            Automated aggregation update.
            Artifact: ${{ env.ARTIFACT_URL }}
          commit-message: "Aggregation layout: ${{ env.ARTIFACT_URL }}"
          add-paths: |
            README.md
            merge/EBeam.png
        if: github.repository_owner == 'SiEPIC'
